<script>
// ---------- Saldos ----------
function filaSaldo(x){
  return `
    <div class="fila">
      <div class="avatar">${iniciales(x.nombre)}</div>
      <div class="cuerpo"><div class="titulo">${esc(x.nombre)}</div></div>
      <div class="valor num ${claseSaldo(x.saldo)}">${saldoTxt(x.saldo)}</div>
    </div>`;
}

async function cargarSaldos(){
  const [s, r] = await Promise.all([run('getSaldos'), run('getResumen')]);
  const deben = s.filter(x => x.saldo < 0);
  const favor = s.filter(x => x.saldo > 0).sort((a, b) => b.saldo - a.saldo);
  const alDia = s.filter(x => x.saldo === 0);
  const suma = l => l.reduce((t, x) => t + x.saldo, 0);

  $('sDebe').textContent = fmt(suma(deben));
  $('sDebeN').textContent = deben.length ? `por cobrar a ${deben.length}` : 'nadie debe';
  $('sFavor').textContent = fmt(suma(favor));
  $('sFavorN').textContent = favor.length ? `a favor de ${favor.length}` : 'sin saldos a favor';

  const bloque = (titulo, l) => l.length
    ? `<div class="seccion"><h2>${titulo}</h2><span>${l.length}</span></div><div class="lista">${l.map(filaSaldo).join('')}</div>` : '';
  $('tSaldos').innerHTML = s.length
    ? bloque('Deben', deben) + bloque('A favor', favor) + bloque('Al día', alDia)
    : '<div class="vacio" style="margin-top:12px"><b>Sin movimientos todavía</b>Registra un partido o un abono para ver los saldos.</div>';
  $('resumen').value = r;
}

function whatsapp(){ window.open('https://wa.me/?text=' + encodeURIComponent($('resumen').value), '_blank'); }
function copiar(){
  const t = $('resumen');
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
    .catch(() => { t.select(); document.execCommand('copy'); })
    .finally(() => msg('Resumen copiado'));
}
</script>
