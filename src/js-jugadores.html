<script>
// ---------- Jugadores ----------
function mostrarFormJug(ver){
  $('jVistaForm').style.display = ver ? 'block' : 'none';
  $('jVistaLista').style.display = ver ? 'none' : 'block';
  if (ver) { $('jNombres').value = ''; $('jNombres').focus(); }
  else cargarPlantel();
  window.scrollTo(0, 0);
}

async function cargarPlantel(){
  const p = await run('getPlantel');
  window._plantel = p;
  const activos = p.filter(x => x.activo).length;
  $('jResumen').textContent = p.length
    ? `${activos} activo(s)` + (p.length > activos ? ` · ${p.length - activos} inactivo(s)` : '')
    : 'Aún no hay jugadores';
  $('jLista').innerHTML = p.map((x, i) => `
    <div class="item ${x.activo ? '' : 'off'}" id="jg${i}">
      <div class="cab" onclick="abrirJugador(${i})">
        <span class="rival">${esc(x.nombre)}${x.activo ? '' : '<span class="tag">inactivo</span>'}</span>
        <span class="meta ${x.saldo<0?'neg':x.saldo>0?'pos':''}" style="font-weight:600;font-size:15px">${x.saldo<0?'-':''}${fmt(x.saldo)}</span>
      </div>
      <div class="det">
        <div class="fila">
          <span>Activo <small style="color:#777">(aparece en Partido y Abono)</small></span>
          <label class="sw"><input type="checkbox" ${x.activo ? 'checked' : ''} onchange="toggleActivo(${i}, this.checked)"><span></span></label>
        </div>
        <p style="margin:12px 0 4px"><strong>Últimos movimientos</strong></p>
        <div id="jh${i}" style="font-size:13px;color:#777">Cargando…</div>
        <button class="btn sec" onclick="renombrar(${i})">Renombrar</button>
      </div>
    </div>`).join('');
}

async function abrirJugador(i){
  const card = $('jg' + i);
  card.classList.toggle('abierto');
  if (!card.classList.contains('abierto') || card.dataset.cargado) return;
  const ms = await run('getMovimientosJugador', window._plantel[i].nombre, 15);
  card.dataset.cargado = '1';
  $('jh' + i).innerHTML = ms.length
    ? '<table class="hist">' + ms.map(m => `
        <tr><td>${esc(m.fecha)}</td>
            <td>${m.tipo === 'ABONO' ? 'Abono' : 'Partido'}${m.nota ? ' · ' + esc(m.nota) : ''}</td>
            <td class="n ${m.tipo === 'ABONO' ? 'pos' : 'neg'}">${m.tipo === 'ABONO' ? '+' : '-'}${fmt(m.monto)}</td></tr>`).join('') + '</table>'
    : 'Sin movimientos todavía';
}

async function nuevosJugadores(){
  const r = await run('agregarJugadores', $('jNombres').value);
  msg(`${r.agregados} agregado(s)` + (r.repetidos.length ? ` · ya existían: ${r.repetidos.join(', ')}` : ''));
  await refrescarActivos();
  mostrarFormJug(false);
}

async function toggleActivo(i, activo){
  const j = window._plantel[i];
  await run('setActivo', j.nombre, activo);
  msg(`${j.nombre} ${activo ? 'activado' : 'desactivado'}`);
  await Promise.all([cargarPlantel(), refrescarActivos()]);
}

async function renombrar(i){
  const j = window._plantel[i];
  const nuevo = prompt('Nuevo nombre:', j.nombre);
  if (!nuevo || nuevo.trim() === j.nombre) return;
  await run('renombrarJugador', j.nombre, nuevo.trim());
  msg('Nombre actualizado');
  await Promise.all([cargarPlantel(), refrescarActivos()]);
}
</script>
