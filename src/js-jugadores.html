<script>
// ---------- Plantel ----------
function mostrarFormJug(ver){
  $('jVistaForm').style.display = ver ? 'block' : 'none';
  $('jVistaLista').style.display = ver ? 'none' : 'block';
  if (ver) { $('jNombres').value = ''; $('jNombres').focus(); }
  else cargarPlantel();
  window.scrollTo(0, 0);
}

async function cargarPlantel(){
  const p = await run('getPlantel');
  window._plantel = p;
  const activos = p.filter(x => x.activo).length;
  $('jResumen').textContent = p.length
    ? `${activos} activos` + (p.length > activos ? ` · ${p.length - activos} inactivos` : '')
    : '';
  $('jLista').innerHTML = p.length ? p.map((x, i) => `
    <button class="fila ${x.activo ? '' : 'off'}" id="jg${i}" onclick="abrirJugador(${i})" aria-expanded="false">
      <div class="avatar">${iniciales(x.nombre)}</div>
      <div class="cuerpo"><div class="titulo">${esc(x.nombre)}${x.activo ? '' : '<span class="tag">inactivo</span>'}</div></div>
      <div class="valor num ${claseSaldo(x.saldo)}">${saldoTxt(x.saldo)}</div>
    </button>
    <div class="ficha" id="jf${i}">
      <div class="interruptor">
        <span>Activo<br><small class="detalle">Aparece al marcar partidos y abonos</small></span>
        <label class="sw"><input type="checkbox" aria-label="Activo" ${x.activo ? 'checked' : ''} onchange="toggleActivo(${i}, this.checked)"><span></span></label>
      </div>
      <div id="jh${i}" class="detalle">Cargando movimientos…</div>
      <div style="display:flex;justify-content:space-between">
        <button class="link" onclick="renombrar(${i})">Cambiar nombre</button>
        <button class="link peligro" onclick="confirmarEliminarJugador(${i})">Eliminar jugador</button>
      </div>
    </div>`).join('')
    : '<div class="vacio"><b>El plantel está vacío</b>Agrega a los jugadores para poder marcarlos en los partidos.</div>';
}

async function abrirJugador(i){
  const f = $('jf' + i), b = $('jg' + i);
  const abierta = f.classList.toggle('abierta');
  b.setAttribute('aria-expanded', abierta);
  if (!abierta || f.dataset.cargado) return;
  const ms = await run('getMovimientosJugador', window._plantel[i].nombre, 15);
  f.dataset.cargado = '1';
  $('jh' + i).innerHTML = ms.length
    ? '<table class="hist">' + ms.map(m => `
        <tr><td>${esc(m.fecha)}<br><small class="detalle">${m.tipo === 'ABONO' ? 'Abono' : 'Partido'}${m.nota ? ' ' + esc(m.nota) : ''}</small></td>
            <td class="${m.tipo === 'ABONO' ? 'favor' : 'debe'}">${m.tipo === 'ABONO' ? '+' : '−'}${fmt(m.monto)}</td></tr>`).join('') + '</table>'
    : '<p style="margin:4px 0 8px">Sin movimientos todavía.</p>';
}

async function nuevosJugadores(){
  const r = await run('agregarJugadores', $('jNombres').value);
  msg(`${r.agregados} agregado(s)` + (r.repetidos.length ? ` · ya estaban: ${r.repetidos.join(', ')}` : ''));
  await refrescarActivos();
  mostrarFormJug(false);
}

async function toggleActivo(i, activo){
  const j = window._plantel[i];
  await run('setActivo', j.nombre, activo);
  msg(`${j.nombre} ${activo ? 'activado' : 'desactivado'}`);
  await Promise.all([cargarPlantel(), refrescarActivos()]);
}

async function confirmarEliminarJugador(i){
  const j = window._plantel[i];
  let texto = `¿Eliminar a ${j.nombre} del plantel?`;
  if (j.movimientos) {
    texto += `\n\nSe borrarán sus ${j.movimientos} movimiento(s) (partidos y abonos)`
          + (j.saldo ? ` y su saldo de ${saldoTxt(j.saldo)}${j.saldo < 0 ? ' por cobrar' : ' a favor'} desaparecerá` : '')
          + `.\nTambién se quitará de los partidos en que jugó.`
          + (j.activo ? `\n\nSi solo dejó de venir, es mejor desactivarlo: así conservas su historial.` : '')
          + `\n\nEsta acción no se puede deshacer.`;
  }
  if (!confirm(texto)) return;
  await run('eliminarJugador', j.nombre);
  msg(`${j.nombre} eliminado`);
  await Promise.all([cargarPlantel(), refrescarActivos()]);
}

async function renombrar(i){
  const j = window._plantel[i];
  const nuevo = prompt('Nuevo nombre:', j.nombre);
  if (!nuevo || nuevo.trim() === j.nombre) return;
  await run('renombrarJugador', j.nombre, nuevo.trim());
  msg('Nombre actualizado');
  await Promise.all([cargarPlantel(), refrescarActivos()]);
}
</script>
