<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#1D2B3F">
<?!= include('estilos') ?>
</head>
<body>

<header class="club">
  <h1>AndesFC</h1>
  <p id="subtitulo">Partidos</p>
</header>

<main>
  <!-- ================= PARTIDOS ================= -->
  <section id="partido" class="on">
    <!-- lista -->
    <div id="pVistaLista">
      <button class="btn" onclick="mostrarForm(true)">Nuevo partido</button>
      <div id="pResumen" hidden></div>
      <div id="pPartidos"></div>
    </div>

    <!-- crear / editar -->
    <div id="pVistaForm" style="display:none">
      <button class="volver" onclick="volverDesdeForm()">‹ Volver</button>
      <div class="panel">
        <h2 id="pFormTitulo">Nuevo partido</h2>
        <label class="t" for="pRival">Rival</label>
        <input id="pRival" placeholder="Nombre del equipo rival" autocomplete="off">
        <label class="t" for="pFecha">Fecha</label>
        <input type="date" id="pFecha">
        <label class="t" for="pCosto">Costo por jugador</label>
        <input type="number" id="pCosto" inputmode="numeric" placeholder="3000">
      </div>
      <div class="fila-acciones" style="margin-top:16px">
        <button class="btn" id="pFormBtn" onclick="guardarFormPartido()">Crear partido</button>
      </div>
    </div>

    <!-- detalle + jugadores -->
    <div id="pVistaDetalle" style="display:none">
      <button class="volver" onclick="verVista('lista')">‹ Partidos</button>
      <div class="marcador">
        <div class="fecha" id="dFecha"></div>
        <div style="flex:1;min-width:0">
          <h2 id="dTitulo"></h2>
          <p id="dInfo"></p>
        </div>
        <button class="link" onclick="editarPartido()">Editar</button>
      </div>
      <div class="seccion"><h2>¿Quiénes jugaron?</h2><span id="pMarcados"></span></div>
      <div class="lista" id="pLista"></div>
      <div class="barra-fija">
        <div class="cuenta"><b id="pCount">0</b><span id="pCountTxt"> jugadores</span><small>Total <span id="pTotal">$0</span></small></div>
        <button class="btn" onclick="guardarAsistentes()">Guardar</button>
      </div>
      <div style="text-align:center;margin-top:20px">
        <button class="link peligro" onclick="confirmarEliminarPartido()">Eliminar este partido</button>
      </div>
    </div>
  </section>

  <!-- ================= ABONOS ================= -->
  <section id="abono">
    <div class="panel">
      <h2>Registrar abono</h2>
      <label class="t" for="aJug">Jugador</label>
      <select id="aJug"></select>
      <p id="aSaldo" class="detalle" style="margin:8px 2px 0;font-size:14px"></p>
      <label class="t" for="aMonto">Monto</label>
      <input type="number" id="aMonto" class="monto" inputmode="numeric" placeholder="$0">
      <div class="chips" id="aChips"></div>
      <label class="t" for="aNota">Nota (opcional)</label>
      <input id="aNota" placeholder="Transferencia, efectivo…">
    </div>
    <div style="margin-top:16px"><button class="btn" onclick="guardarAbono()">Registrar abono</button></div>
  </section>

  <!-- ================= SALDOS ================= -->
  <section id="saldos">
    <div class="totales">
      <div class="total debe"><b id="sDebe" class="num debe">$0</b><span id="sDebeN">por cobrar</span></div>
      <div class="total favor"><b id="sFavor" class="num favor">$0</b><span id="sFavorN">a favor</span></div>
    </div>
    <div id="tSaldos"></div>
    <div style="margin-top:16px;display:grid;gap:10px">
      <button class="btn wsp" onclick="whatsapp()">Enviar resumen por WhatsApp</button>
      <button class="btn claro" onclick="copiar()">Copiar resumen</button>
    </div>
    <details class="texto">
      <summary>Ver el texto que se envía</summary>
      <textarea id="resumen" rows="12" readonly></textarea>
    </details>
  </section>

  <!-- ================= PLANTEL ================= -->
  <section id="jugadores">
    <div id="jVistaLista">
      <button class="btn" onclick="mostrarFormJug(true)">Nuevo jugador</button>
      <div class="seccion"><h2>Plantel</h2><span id="jResumen"></span></div>
      <div class="lista" id="jLista"></div>
    </div>

    <div id="jVistaForm" style="display:none">
      <button class="volver" onclick="mostrarFormJug(false)">‹ Plantel</button>
      <div class="panel">
        <h2>Nuevo jugador</h2>
        <label class="t" for="jNombre">Nombre</label>
        <input id="jNombre" placeholder="Ej: Diego Lagos" autocomplete="off" autocapitalize="words">
        <label class="t" for="jTelefono">Teléfono</label>
        <input id="jTelefono" type="tel" inputmode="tel" placeholder="9 1234 5678" autocomplete="off">
        <p class="detalle" style="margin:6px 2px 0">Opcional. Sirve para escribirle por WhatsApp desde su ficha.</p>
      </div>
      <div style="margin-top:16px"><button class="btn" onclick="nuevoJugador()">Agregar jugador</button></div>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="Secciones">
  <button data-t="partido" class="on" aria-label="Partidos">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M21 10.5l-5 -.5M17.5 19.5l-3-5M6.5 19.5l3-5M3 10.5l5-.5"/></svg>
    Partidos
  </button>
  <button data-t="abono" aria-label="Abonos">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
    Abonos
  </button>
  <button data-t="saldos" aria-label="Saldos">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15v-3M12 15V8M16 15v-5"/></svg>
    Saldos
  </button>
  <button data-t="jugadores" aria-label="Plantel">
    <svg viewBox="0 0 24 24"><path d="M8 4l-4 2 1.5 4L7 9.5V20h10V9.5l1.5.5L20 6l-4-2c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z"/></svg>
    Plantel
  </button>
</nav>

<div id="msg" role="status" aria-live="polite"></div>

</body>
</html>
