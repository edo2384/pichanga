<script>
// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '$' + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/** Saldo con signo y clase de color: deuda en rojo, a favor en verde. */
const claseSaldo = n => n < 0 ? 'debe' : n > 0 ? 'favor' : 'cero';
const saldoTxt = n => (n < 0 ? '−' : '') + fmt(n);

/** 'dd-MM-yyyy' → bloque de fecha estilo fixture: día grande, mes chico. */
function fechaBloque(f){
  const [d, m] = String(f).split('-');
  return `<b>${esc(Number(d) || '–')}</b><small>${MESES[Number(m) - 1] || ''}</small>`;
}
function iniciales(nombre){
  const p = String(nombre).trim().split(/\s+/);
  return esc(((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase();
}

function msg(t, ms){
  const m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(window._msgT); window._msgT = setTimeout(() => m.style.display = 'none', ms || 2500);
}

// cualquier error no controlado se muestra en pantalla (y en la consola) en vez de fallar en silencio
window.addEventListener('error', e => msg('Error: ' + e.message, 8000));
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  if (r && r._mostrado) return;                       // ya se mostró desde run()
  msg('Error: ' + (r && r.message || r), 8000);
});
/** Funciones que siempre deben devolver una lista: si llega null, es un error del servidor. */
const LISTAS = ['getJugadores', 'getPlantel', 'getPartidos', 'getSaldos', 'getMovimientosJugador'];
const CARGANDO = '<div class="vacio">Cargando…</div>';

function run(fn, ...args){
  return new Promise((ok, ko) => {
    const falla = e => {
      msg('Error: ' + (e && e.message || e), 8000); console.error(fn, e);
      if (e && typeof e === 'object') e._mostrado = true;
      ko(e);
    };
    try {
      const r = google.script.run
        .withSuccessHandler(v => v === null && LISTAS.includes(fn)
          ? falla(new Error(`el servidor no devolvió datos en ${fn}. Revisa Apps Script → Ejecuciones.`))
          : ok(v))
        .withFailureHandler(falla);
      if (typeof r[fn] !== 'function') {
        throw new Error(`falta la función "${fn}" en el servidor. Revisa que el último deploy de GitHub haya terminado bien.`);
      }
      r[fn](...args);
    } catch (e) { falla(e); }
  });
}

// ---------- navegación inferior ----------
const SUBTITULOS = { partido: 'Partidos', abono: 'Abonos', saldos: 'Saldos', jugadores: 'Plantel' };

document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button, main section').forEach(e => e.classList.remove('on'));
  b.classList.add('on'); $(b.dataset.t).classList.add('on');
  $('subtitulo').textContent = SUBTITULOS[b.dataset.t];
  window.scrollTo(0, 0);
  if (b.dataset.t === 'partido') mostrarForm(false);
  if (b.dataset.t === 'abono') prepararAbono();
  if (b.dataset.t === 'saldos') cargarSaldos();
  if (b.dataset.t === 'jugadores') mostrarFormJug(false);
});

function pintarJugadores(js){
  window._activos = js;
  $('aJug').innerHTML = js.map(j => `<option value="${esc(j)}">${esc(j)}</option>`).join('');
}
async function refrescarActivos(){ pintarJugadores(await run('getJugadores')); }
</script>
