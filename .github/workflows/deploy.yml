# Prueba y publica la app en Google Apps Script en cada push a main.
#
# Requiere en GitHub → Settings → Secrets and variables → Actions:
#   Secret    CLASPRC_JSON   contenido de ~/.clasprc.json (después de `clasp login`)
#   Variable  DEPLOYMENT_ID  ID de la implementación web existente (para que la URL /exec no cambie)

name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', '.clasp.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas
        run: node test/backend.test.js

      - name: Revisar configuración
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          if grep -q REEMPLAZAR .clasp.json; then echo "::error::Falta el scriptId en .clasp.json"; exit 1; fi
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secreto CLASPRC_JSON"; exit 1; fi
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::Falta la variable DEPLOYMENT_ID"; exit 1; fi

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Credenciales
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Subir código
        run: clasp push --force

      - name: Publicar en la implementación existente
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          DESC="${GITHUB_SHA::7} $(printf '%s' "${COMMIT_MSG:-manual}" | head -n1 | cut -c1-80)"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$DESC"

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.clasprc.json
